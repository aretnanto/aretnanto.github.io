    { key: "gamma", label: "γ (curve)", min: 0.25, max: 3, step: 0.25, value: 1 },
    { key: "n", label: "n (levels)", type: "choice", options: [["0", "∞ (continuous)"], ["2", "2"], ["4", "4"], ["8", "8"]], value: "0" },
    { key: "iv", label: "Contour interval (% of range)", min: 2, max: 25, step: 1, value: 8 },
    { key: "zmm", label: "Print relief Z (mm)", min: 3, max: 30, step: 1, value: 12 },
  ],
  P: null, cache: null, ckey: "",
  gainAt(x, y) {
    if (!S.fric) return 1;
    const q = qAt(x, y); if (q < 0) return 1;
    return 1 - this.P.k * Math.pow(quant(q, +this.P.n), this.P.gamma);
  },
  regionAt(x, y) { return inGrid(x, y) ? "terrain" : "outside"; },
  valueAt(x, y) { return Math.max(0, qAt(x, y)); },
  layer() {
    const key = this.P.iv; if (this.cache && this.ckey === key) return this.cache;
    this.ckey = key;
    const c = this.cache || (this.cache = document.createElement("canvas")); c.width = W; c.height = H;
    const b = c.getContext("2d"), img = b.createImageData(W, H), d = img.data, iv = this.P.iv / 100, band = new Int16Array(W * H).fill(-1);
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const o = (py * W + px) * 4, q = qAt(px + .5, py + .5);
      if (q < 0) { d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = 255; continue; }
      band[py * W + px] = Math.floor(q / iv);
      const [A, B] = q < .5 ? [RAMP[0], RAMP[1]] : [RAMP[1], RAMP[2]], u = q < .5 ? q * 2 : (q - .5) * 2;
      d[o] = A[0] + (B[0] - A[0]) * u; d[o + 1] = A[1] + (B[1] - A[1]) * u; d[o + 2] = A[2] + (B[2] - A[2]) * u; d[o + 3] = 255;
    }
    for (let py = 1; py < H; py++) for (let px = 1; px < W; px++) {   // contour lines
      const p = py * W + px, e = (band[p - 1] >= 0 && band[p - 1] !== band[p]) || (band[p - W] >= 0 && band[p - W] !== band[p]);
      if (e && band[p] >= 0) { const o = p * 4, dark = (qAt(px, py) > .55); const f = dark ? 235 : 40; d[o] = d[o + 1] = d[o + 2] = f; }
    }
    b.putImageData(img, 0, 0); return c;
  },
  draw() {
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    if (S.map) ctx.drawImage(this.layer(), 0, 0);
  },
  read() {
    const q = S.v, qn = quant(q, +this.P.n);
    return [["Region", S.region], ["Height", S.region === "terrain" ? (lo + q * (hi - lo)).toFixed(0) + " m" : "–"], ["q (normalized)", q.toFixed(3)], ["q_n", qn.toFixed(3)], ["Gain g", S.g.toFixed(3)], ["C/D = 1/g", (1 / S.g).toFixed(2)], ["Slowdown R = 1/(1−k)", (1 / (1 - this.P.k)).toFixed(2) + "×"]];
  },
};

/* ---------------- STL: z(v) = z0 + Z * [q_n(v)]^gamma, watertight solid ---------------- */
function exportSTL() {
  const P = TERRAIN.P, Z = +P.zmm, z0 = 2, widthMM = 100, s = widthMM / (VOL.w - 1), Wd = VOL.w, Hd = VOL.h;
  const top = new Float32Array(Wd * Hd);
  for (let k = 0; k < top.length; k++) top[k] = z0 + Z * Math.pow(quant(NQ[k], +P.n), P.gamma);
  const tris = [], V = (i, j, z) => [i * s, (Hd - 1 - j) * s, z];
  const add = (a, b, c) => tris.push([a, b, c]);
  for (let j = 0; j < Hd - 1; j++) for (let i = 0; i < Wd - 1; i++) {
    const k = j * Wd + i, a = V(i, j, top[k]), b = V(i + 1, j, top[k + 1]), c = V(i, j + 1, top[k + Wd]), d = V(i + 1, j + 1, top[k + Wd + 1]);
    add(a, c, b); add(b, c, d);
    const a0 = V(i, j, 0), b0 = V(i + 1, j, 0), c0 = V(i, j + 1, 0), d0 = V(i + 1, j + 1, 0);
    add(a0, b0, c0); add(b0, d0, c0);
  }
  for (let i = 0; i < Wd - 1; i++) {   // front/back walls (j = 0 and j = Hd-1)
    for (const j of [0, Hd - 1]) {
      const k = j * Wd + i, a = V(i, j, top[k]), b = V(i + 1, j, top[k + 1]), a0 = V(i, j, 0), b0 = V(i + 1, j, 0);
      if (j === 0) { add(a, b, a0); add(b, b0, a0); } else { add(a, a0, b); add(b, a0, b0); }
    }
  }
  for (let j = 0; j < Hd - 1; j++) {   // left/right walls (i = 0 and i = Wd-1)
    for (const i of [0, Wd - 1]) {
      const k = j * Wd + i, a = V(i, j, top[k]), b = V(i, j + 1, top[k + Wd]), a0 = V(i, j, 0), b0 = V(i, j + 1, 0);
      if (i === 0) { add(a, a0, b); add(b, a0, b0); } else { add(a, b, a0); add(b, b0, a0); }
    }
  }
  const buf = new ArrayBuffer(84 + tris.length * 50), dv = new DataView(buf); dv.setUint32(80, tris.length, true);
  tris.forEach((t, n) => {
    const [a, b, c] = t, u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    let nx = u[1] * v[2] - u[2] * v[1], ny = u[2] * v[0] - u[0] * v[2], nz = u[0] * v[1] - u[1] * v[0]; const m = Math.hypot(nx, ny, nz) || 1;
    const o = 84 + n * 50; [nx / m, ny / m, nz / m, ...a, ...b, ...c].forEach((f, i) => dv.setFloat32(o + i * 4, f, true));
  });
  download(new Blob([buf], { type: "model/stl" }), "maunga-whau-k" + P.k + "-g" + P.gamma + "-n" + (+P.n || "inf") + ".stl");
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ---------------- logging ---------------- */
function csv() {
  const head = "t_ms,mode,raw_dx,raw_dy,gain_applied,gain_expected,x,y,value,region,cursor_visible,friction_on,map_visible,params,lock_mode";
  const p = JSON.stringify(cur.P).replace(/"/g, "'");
  const rows = S.log.map(e => [e.t.toFixed(3), cur.id, e.dx, e.dy, e.g.toFixed(6), e.ge.toFixed(6), e.x.toFixed(3), e.y.toFixed(3), e.v.toFixed(5), e.r, +S.cursor, +S.fric, +S.map, '"' + p + '"', '"' + S.lockMode + '"'].join(","));
  return [head, ...rows].join("\n");
}
function logNote() { $("lognote").textContent = `${S.log.length} events logged · pointer lock: ${S.lockMode}`; }

/* ---------------- input: pointer lock with raw movement ---------------- */
async function lock() {
  try { const r = cv.requestPointerLock({ unadjustedMovement: true }); if (r && r.then) await r; S.lockMode = "raw (unadjustedMovement honored)"; }
  catch (e) {
    try { const r = cv.requestPointerLock(); if (r && r.then) await r; S.lockMode = "FALLBACK: accelerated (unadjustedMovement not honored)"; }
    catch (e2) { $("status").textContent = "Pointer lock was blocked. Wait a second and click again."; S.lockMode = "blocked"; }
  }
  render();
}
cv.addEventListener("click", () => { if (!S.locked) lock(); });
document.addEventListener("pointerlockchange", () => {
  S.locked = document.pointerLockElement === cv;
  $("status").textContent = S.locked ? "Esc to release" : "Click the canvas to lock the pointer. Esc releases it.";
  render();
});
document.addEventListener("mousemove", e => {
  if (!S.locked) return;
  if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;   // spurious jump right after locking
  const dx = e.movementX, dy = e.movementY, g = cur.gainAt(S.x, S.y), t = performance.now();
  if (S.t0 === null) S.t0 = t;
  const x0 = S.x, y0 = S.y;
  S.x = clamp(S.x + dx * g, 0, W - 1); S.y = clamp(S.y + dy * g, 0, H - 1);
  S.g = g; S.v = cur.valueAt(x0, y0); S.region = cur.regionAt(S.x, S.y);
  if (S.log.length < LOGMAX) S.log.push({ t: t - S.t0, dx, dy, g, ge: g, x: S.x, y: S.y, v: S.v, r: S.region });
  render();
});

/* ---------------- UI ---------------- */
const PROTOS = [BLANK, TERRAIN]; let cur = BLANK, idx = 0;
function render() {
  const noLayers = cur.id === "blank" && cur.stage !== "cursor";   // stages 1–2: no layer controls at all
  $("t-cursor").closest(".card").hidden = noLayers; if (noLayers) S.cursor = true;
  cur.draw();
  if (S.locked && S.cursor) { ctx.fillStyle = "#e8710a"; ctx.beginPath(); ctx.arc(S.x, S.y, 6, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
  else if (!S.locked && cur.id !== "blank") { ctx.fillStyle = "rgba(11,11,11,.72)"; ctx.fillRect(W / 2 - 130, H / 2 - 24, 260, 48); ctx.fillStyle = "#fff"; ctx.font = "500 15px system-ui"; ctx.textAlign = "center"; ctx.fillText("Click to start", W / 2, H / 2 + 5); }
  $("ro").innerHTML = S.locked && !S.cursor ? "<span>Hidden while the cursor is hidden</span><b></b>" : cur.read().map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("");
  if (cur.id !== "blank") $("ro").insertAdjacentHTML("beforeend", `<span>Pointer lock</span><b class="${S.lockMode.startsWith("FALLBACK") ? "warn" : ""}">${S.lockMode.split(" ")[0]}</b>`);
  logNote();
}
function toggle(id, key, label) { $(id).onclick = e => { S[key] = !S[key]; e.currentTarget.setAttribute("aria-pressed", S[key]); render(); }; }
toggle("t-cursor", "cursor"); toggle("t-fric", "fric"); toggle("t-map", "map");
$("b-csv").onclick = () => download(new Blob([csv()], { type: "text/csv" }), `interim1-${cur.id}-log.csv`);
$("b-clear").onclick = () => { S.log = []; S.t0 = null; render(); };
$("b-stl").onclick = exportSTL;
function renderParams() {
  const el = $("params"); el.innerHTML = "";
  cur.params.forEach(p => {
    if (p.when && !p.when(cur.P)) return;
    const d = document.createElement("div"); d.className = "ctrl";
    if (p.type === "choice") {
      d.innerHTML = `<label for="p-${p.key}">${p.label}</label><select id="p-${p.key}">${p.options.map(([v, t]) => `<option value="${v}"${String(cur.P[p.key]) === v ? " selected" : ""}>${t}</option>`).join("")}</select>`;
      d.querySelector("select").onchange = e => { cur.P[p.key] = e.target.value; if (p.rerender) renderParams(); render(); };
    } else {
      d.innerHTML = `<label for="p-${p.key}">${p.label} <output>${cur.P[p.key]}</output></label><input type="range" id="p-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${cur.P[p.key]}">`;
      const i = d.querySelector("input"), o = d.querySelector("output"); i.oninput = () => { cur.P[p.key] = +i.value; o.textContent = i.value; render(); };
    }
    el.appendChild(d);
  });
  if (cur.panel) cur.panel(el);
}
function show(i) {
  if (document.pointerLockElement) document.exitPointerLock();
  idx = i; cur = PROTOS[i]; if (!cur.P) { cur.P = {}; cur.params.forEach(p => cur.P[p.key] = p.value); }
  S.x = W / 2; S.y = H / 2; S.g = 1; S.v = 0; S.region = "";
  $("scopenote").textContent = cur.scope + " This page describes cursor motion only, not perception.";
  $("layer-note").textContent = cur.layerNote; $("b-stl").hidden = cur.id !== "terrain"; $("t-fric").hidden = $("t-map").hidden = cur.id === "blank"; if (cur.id === "blank") { S.fric = true; S.map = true; }
  [...$("tabs").children].forEach((t, k) => t.setAttribute("aria-current", k === i));
  renderParams(); render();
}
PROTOS.forEach((p, i) => { const b = document.createElement("button"); b.className = "tab"; b.textContent = p.name; b.onclick = () => show(i); $("tabs").appendChild(b); });
show(location.hash === "#terrain" ? 1 : 0);
})();
</script>
