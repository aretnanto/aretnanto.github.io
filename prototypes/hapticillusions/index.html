<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haptic Network Prototypes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A lasso tool and seven browser prototypes that use pseudo-haptics to make node-link diagrams feel sticky, hilly, heavy, springy, rough or magnetic, plus a canvas for drawing textured communities. Aditya Retnanto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Same look as drep/hciprinciples demo pages: header with tabs, dashboard greys, Previous / k of N / Next footer. */
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --text: #0b0b0b; --text-muted: #52514e; --border: #e1e0d9; --accent: #0b0b0b;
  --navy: #000fa1; --sel: #e8710a; --sel-ink: #b85a07;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { background: var(--bg); margin: 0 }
body { color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5 }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance }
p { margin: 0 }
a { color: inherit }
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px }

header.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; flex-wrap: wrap }
.bar h1 { font-size: 18px }
.bar h1 a { text-decoration: none }
.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tab { font-size: 14px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-muted); cursor: pointer }
.tab[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff }

main { padding: 20px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 70px) }
.dash-head { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px }
.dash-head h2 { font-size: 22px; margin-right: auto }
.mock { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); border: 1px dashed var(--text-muted); border-radius: 4px; padding: 2px 8px }
.task { font-size: 15px; flex-basis: 100% }
.task b { color: var(--sel-ink) }

.demo { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start }
.view { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.view h3 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.view h3 span { font-weight: 400; color: var(--text-muted); font-size: 13px }
#ph { width: 100%; height: auto; display: block; border-radius: 6px; cursor: pointer; touch-action: none; border: 1px solid var(--border) }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.row { display: flex; gap: 6px; flex-wrap: wrap }
.sbtn { font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-muted); cursor: pointer }
.sbtn:hover { background: #f0efec }
.sbtn[aria-pressed="true"] { background: #0b0b0b; border-color: #0b0b0b; color: #fff }
.ctrl { display: flex; flex-direction: column; gap: 2px; font-size: 13px }
.ctrl label { display: flex; justify-content: space-between; gap: 8px; color: var(--text-muted) }
.ctrl output { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums }
.ctrl input { width: 100%; accent-color: #52514e }
.ctrl select { font-size: 13px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px; background: #ffffff; color: var(--text) }
.readout { font-size: 14px; color: var(--text-muted); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums }
.readout b { color: var(--text); font-weight: 600 }
.how { font-size: 14px }
.sub { font-size: 12px; color: var(--text-muted); margin-bottom: -4px }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.2) }
.cite { font-size: 12px; color: var(--text-muted) }

.spacer { flex: 1 }
.page-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--border) }
.btn { font-size: 14px; padding: 8px 16px; border: 1px solid #0b0b0b; background: var(--surface); border-radius: 6px; cursor: pointer }
.btn:hover { background: #f0efec }
.btn.next { background: #0b0b0b; color: #fff }
.btn.next:hover { background: #2b2b2b }
.btn:disabled { visibility: hidden }
.page-count { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums }

@media (max-width: 1000px) { .demo { grid-template-columns: minmax(0,1fr) } }
@media (max-width: 700px) { main { padding: 12px 16px } }
</style>
</head>
<body>

<header class="bar"><div class="bar-in">
  <h1><a href="../../prototypes.html">Haptic network prototypes</a></h1>
  <nav class="tabs" id="tabs" aria-label="Prototypes"></nav>
</div></header>

<main>
  <div class="dash-head">
    <h2 id="p-title"></h2>
    <span class="mock" id="p-sub"></span>
    <p class="task" id="p-task"></p>
  </div>

  <div class="demo">
    <div class="view">
      <h3>Network <span id="status">Click the chart to lock the pointer</span></h3>
      <canvas id="ph" width="1280" height="680" aria-label="Prototype canvas. Click to lock the pointer."></canvas>
    </div>
    <div class="side">
      <div class="view">
        <h3>Illusion</h3>
        <div class="row">
          <button class="sbtn" id="c-on" aria-pressed="true">Illusion on</button>
          <button class="sbtn" id="c-hide" aria-pressed="false">Hide visuals</button>
          <button class="sbtn" id="c-ghost" aria-pressed="false">Show real pointer</button>
          <button class="sbtn" id="c-new">New data</button>
        </div>
      </div>
      <div class="view">
        <h3>Parameters</h3>
        <div id="params" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
      <div class="view">
        <h3>Under the cursor</h3>
        <div class="readout" id="readout"></div>
      </div>
      <div class="view">
        <h3>How it works</h3>
        <p class="how" id="p-how"></p>
        <p class="cite" id="p-cite"></p>
      </div>
    </div>
  </div>

  <div class="spacer"></div>
  <nav class="page-nav"><button class="btn" id="prev">← Previous</button><span class="page-count" id="count"></span><button class="btn next" id="next">Next →</button></nav>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $("ph"), ctx = cv.getContext("2d");
const LW = 640, LH = 340, PT = 24, PLOT = 272, BASE = PT + PLOT;
ctx.scale(cv.width / LW, cv.height / LH);
const NAVY = "#000fa1", GREY = "#e1e0d9", MUTED = "#52514e";
const R = (a, b) => Math.round(a + Math.random() * (b - a));
// The cursor can never leave the chart area: every position is clamped to the current prototype's bounds.
const AREA = { x0: 34, x1: LW - 34, y0: PT, y1: BASE };
const B = () => (cur && cur.bounds) || AREA;
const cx = v => Math.max(B().x0, Math.min(B().x1, v)), cy = v => Math.max(B().y0, Math.min(B().y1, v));

// shared state: S.x/S.y is the drawn cursor; S.rx/S.ry is where the hand "really" is (raw movement, no illusion)
const S = { x: LW / 2, y: LH / 2, rx: LW / 2, ry: LH / 2, jx: 0, jy: 0, locked: false, on: true, hide: false, ghost: false };
const g1 = (k, v) => S.on ? 1 - k * v / 100 : 1;   // gain that drops with the value
function axis() { ctx.strokeStyle = MUTED; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(16, BASE + .5); ctx.lineTo(LW - 16, BASE + .5); ctx.stroke(); }
function label(t, x, y = BASE + 22, col = MUTED) { ctx.fillStyle = col; ctx.font = "600 14px 'DM Sans', sans-serif"; ctx.textAlign = "center"; ctx.fillText(t, x, y); }
function hiddenRect(x, y, w, h) {
  ctx.fillStyle = "#f0efec"; ctx.fillRect(x, y, w, h);
  ctx.setLineDash([4, 4]); ctx.strokeStyle = "#c3c2b7"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); ctx.setLineDash([]);
}
const K = (v = 0.8) => ({ key: "k", label: "Strength", min: 0, max: 0.95, step: 0.05, value: v });

// ---------- texture helpers for the Draw prototype ----------
const TEX = {
  sticky:   { name: "Sticky",   col: "#e8710a", feel: "slows the cursor" },
  slippery: { name: "Slippery", col: "#5a9bd5", feel: "speeds it up" },
  ridged:   { name: "Ridged",   col: "#000fa1", feel: "slow–fast stripes" },
  rough:    { name: "Rough",    col: "#52514e", feel: "shakes it" },
  magnetic: { name: "Magnetic", col: "#7a3fb0", feel: "pulls to the centre" },
};
function blob(x, y, r, tex) {
  const f1 = Math.random() * 6, f2 = Math.random() * 6, pts = [];
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, rr = r * (1 + .18 * Math.sin(3 * a + f1) + .1 * Math.sin(5 * a + f2)); pts.push([x + rr * Math.cos(a), y + rr * Math.sin(a) * .8]); }
  return makeShape(pts, tex);
}
function makeShape(pts, tex) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const sh = { pts, tex, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys),
    cx: xs.reduce((a, b) => a + b, 0) / xs.length, cy: ys.reduce((a, b) => a + b, 0) / ys.length, dots: [] };
  const n = Math.round((sh.x1 - sh.x0) * (sh.y1 - sh.y0) / 30);
  for (let i = 0; i < n; i++) sh.dots.push([sh.x0 + Math.random() * (sh.x1 - sh.x0), sh.y0 + Math.random() * (sh.y1 - sh.y0), Math.random() < .5 ? 1 : 2]);
  return sh;
}
function inside(sh, x, y) {
  if (x < sh.x0 || x > sh.x1 || y < sh.y0 || y > sh.y1) return false;
  let c = false;
  for (let i = 0, j = sh.pts.length - 1; i < sh.pts.length; j = i++) {
    const [xi, yi] = sh.pts[i], [xj, yj] = sh.pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function paintShape(sh, period) {
  ctx.save(); ctx.beginPath(); sh.pts.forEach((p, i) => ctx[i ? "lineTo" : "moveTo"](p[0], p[1])); ctx.closePath();
  const t = TEX[sh.tex];
  if (S.hide) { ctx.fillStyle = "#f0efec"; ctx.fill(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "#c3c2b7"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); return; }
  ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.strokeStyle = t.col; ctx.lineWidth = 2; ctx.stroke(); ctx.clip();
  const { x0, x1, y0, y1 } = sh;
  if (sh.tex === "sticky") {          // honey: warm fill and dense drops
    ctx.fillStyle = "rgba(232,113,10,.22)"; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.fillStyle = "rgba(184,90,7,.7)";
    for (let y = y0; y < y1; y += 8) for (let x = x0 + ((y / 8) % 2) * 4; x < x1; x += 8) { ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill(); }
  } else if (sh.tex === "slippery") { // ice: pale fill, sparse diagonal glints
    ctx.fillStyle = "rgba(90,155,213,.14)"; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.strokeStyle = "rgba(90,155,213,.7)"; ctx.lineWidth = 1.5;
    for (let d = x0 - (y1 - y0); d < x1; d += 22) { ctx.beginPath(); ctx.moveTo(d, y1); ctx.lineTo(d + (y1 - y0), y0); ctx.stroke(); }
  } else if (sh.tex === "ridged") {   // stripes at exactly the felt period
    ctx.fillStyle = "rgba(0,15,161,.75)";
    for (let x = Math.floor(x0 / period) * period; x < x1; x += period) ctx.fillRect(x, y0, period / 2, y1 - y0);
  } else if (sh.tex === "rough") {    // grit
    ctx.fillStyle = "rgba(82,81,78,.12)"; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.fillStyle = "#3a3936";
    sh.dots.forEach(d => ctx.fillRect(d[0], d[1], d[2], d[2]));
  } else if (sh.tex === "magnetic") { // field rings around the centre
    ctx.strokeStyle = "rgba(122,63,176,.55)"; ctx.lineWidth = 1.5;
    for (let r = 6; r < Math.max(x1 - x0, y1 - y0); r += 10) { ctx.beginPath(); ctx.arc(sh.cx, sh.cy, r, 0, 7); ctx.stroke(); }
    ctx.fillStyle = "#7a3fb0"; ctx.beginPath(); ctx.arc(sh.cx, sh.cy, 3, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---------- shared network helpers ----------
function makeGraph(n) {
  const nodes = []; let tries = 0; const gap = n > 16 ? 55 : n > 11 ? 66 : 80;
  while (nodes.length < n && tries++ < 8000) {
    const q = { x: R(70, 570), y: R(PT + 26, BASE - 26) };
    if (nodes.every(o => Math.hypot(o.x - q.x, o.y - q.y) > gap)) nodes.push(q);
  }
  nodes.forEach((q, i) => { q.id = String.fromCharCode(65 + i); q.v = R(5, 95); });
  const seen = new Set(), edges = [];
  nodes.forEach((q, i) => nodes.map((o, j) => [j, Math.hypot(o.x - q.x, o.y - q.y)]).filter(([j]) => j !== i).sort((a, b) => a[1] - b[1]).slice(0, 2)
    .forEach(([j]) => { const k = Math.min(i, j) + "-" + Math.max(i, j); if (!seen.has(k)) { seen.add(k); edges.push({ a: i, b: j, u: R(0, 100), w: R(5, 95), seed: Math.random() * 1000, bend: 0 }); } }));
  return { nodes, edges };
}
function segInfo(g, e, x, y) {
  const A = g.nodes[e.a], Bn = g.nodes[e.b], vx = Bn.x - A.x, vy = Bn.y - A.y, L2 = vx * vx + vy * vy, L = Math.sqrt(L2);
  const t = Math.max(0, Math.min(1, ((x - A.x) * vx + (y - A.y) * vy) / L2)), px = A.x + t * vx, py = A.y + t * vy;
  return { e, t, px, py, d: Math.hypot(x - px, y - py), nx: -vy / L, ny: vx / L };
}
function nearestEdge(g, x, y, reach) { let best = null; g.edges.forEach(e => { const s = segInfo(g, e, x, y); if (s.d < reach && (!best || s.d < best.d)) best = s; }); return best; }
function nearestNode(g, x, y, reach) { let best = null, bd = reach; g.nodes.forEach(q => { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = q; } }); return best; }
const nodeR = (q, sized) => S.hide || !sized ? 10 : 7 + q.v * 0.13;
const nodeFill = q => S.hide ? "#ffffff" : `rgba(0,15,161,${.25 + .75 * q.v / 100})`;
const nodeStroke = () => S.hide ? "#a9a89f" : NAVY;
const edgeEnds = (g, e) => [g.nodes[e.a], g.nodes[e.b]];
function drawEdge(g, e, col = "#b9b8b0", w = 1.5) {
  const [A, Bn] = edgeEnds(g, e);
  ctx.beginPath(); ctx.moveTo(A.x, A.y);
  if (e.bend) {
    const L = Math.hypot(Bn.x - A.x, Bn.y - A.y), nx = -(Bn.y - A.y) / L, ny = (Bn.x - A.x) / L;
    ctx.quadraticCurveTo((A.x + Bn.x) / 2 + nx * 2 * e.bend, (A.y + Bn.y) / 2 + ny * 2 * e.bend, Bn.x, Bn.y);
  } else ctx.lineTo(Bn.x, Bn.y);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function drawNode(q, r, fill, stroke, hl) {
  ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = hl ? "#e8710a" : stroke; ctx.lineWidth = hl ? 3 : 1.5; ctx.stroke();
  ctx.fillStyle = fill === "#ffffff" ? MUTED : q.v > 45 ? "#ffffff" : NAVY;
  ctx.font = "600 11px 'DM Sans', sans-serif"; ctx.textAlign = "center"; ctx.fillText(q.id, q.x, q.y + 4);
}
const plainNode = q => drawNode(q, 9, "#ffffff", nodeStroke(), false);
const NODES = (v = 12) => ({ key: "n", label: "Nodes", min: 5, max: 22, step: 1, value: v, reinit: true });

cv.addEventListener("pointerup", () => {
  if (!drawing() || !cur.stroke) return;
  if (cur.stroke.length >= 6) cur.shapes.push(makeShape(cur.stroke, cur.tex));
  cur.stroke = null; render();
});
document.addEventListener("pointerlockchange", () => {
  S.locked = document.pointerLockElement === cv;
  if (S.locked) {
    if (startAt) { S.x = startAt[0]; S.y = startAt[1]; startAt = null; }
    S.x = cx(S.x); S.y = cy(S.y); S.rx = S.x; S.ry = S.y;
  } else { if (cur.up) cur.up(); S.jx = S.jy = 0; }
  if (!drawing()) $("status").textContent = S.locked ? "Esc to release" : "Click the chart to lock the pointer";
  render();
});
document.addEventListener("mousemove", e => {
  if (!active()) return;
  if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;   // browsers sometimes report a spurious jump right after locking
  const s = LW / cv.getBoundingClientRect().width, dx = e.movementX * s, dy = e.movementY * s;
  S.rx = cx(S.rx + dx); S.ry = cy(S.ry + dy);
  cur.move(dx, dy);
  S.x = cx(S.x); S.y = cy(S.y);
  render();
});
document.addEventListener("mousedown", () => { if (S.locked && cur.down) { cur.down(); render(); } });
document.addEventListener("mouseup", () => { if (cur.up) { cur.up(); render(); } });

// ---------- controls ----------
function toggle(id, key, onText, offText) {
  $(id).onclick = e => {
    S[key] = !S[key]; e.currentTarget.setAttribute("aria-pressed", key === "on" ? S.on : S[key]);
    if (onText) e.currentTarget.textContent = S[key] ? onText : offText;
    render();
  };
}
toggle("c-on", "on", "Illusion on", "Illusion off");
toggle("c-hide", "hide");
toggle("c-ghost", "ghost");
$("c-new").onclick = () => { cur.init(false); render(); };
function renderParams() {
  const el = $("params"); el.innerHTML = "";
  const fmt = (p, v) => (p.step < 1 ? v.toFixed(2) : String(v)) + (p.unit || "");
  cur.params.forEach(p => {
    const d = document.createElement("div"); d.className = "ctrl";
    if (p.type === "choice") {
      d.innerHTML = `<label for="pp-${p.key}">${p.label}</label><select id="pp-${p.key}">${p.options.map(([v, t]) => `<option value="${v}"${cur.P[p.key] === v ? " selected" : ""}>${t}</option>`).join("")}</select>`;
      const sel = d.querySelector("select"); sel.onchange = () => { cur.P[p.key] = sel.value; if (p.reinit) cur.init(false, "param"); if (cur.mystery) { cur.mystery = false; renderParams(); } render(); };
      el.appendChild(d); return;
    }
    d.innerHTML = `<label for="pp-${p.key}">${p.label} <output>${fmt(p, cur.P[p.key])}</output></label><input type="range" id="pp-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${cur.P[p.key]}">`;
    const inp = d.querySelector("input"), out = d.querySelector("output");
    inp.oninput = () => { cur.P[p.key] = +inp.value; out.textContent = fmt(p, cur.P[p.key]); if (p.reinit) cur.init(false, "param"); render(); };
    el.appendChild(d);
  });
  if (cur.panel) cur.panel(el);
}

// ---------- navigation ----------
const tabs = $("tabs");
PROTOS.forEach((p, i) => {
  const b = document.createElement("button"); b.className = "tab"; b.textContent = p.name; b.onclick = () => show(i); tabs.appendChild(b);
});
let idx = 0;
function show(i) {
  if (document.pointerLockElement) document.exitPointerLock();
  idx = Math.max(0, Math.min(PROTOS.length - 1, i));
  if (cur.up) cur.up();
  cur = PROTOS[idx];
  if (!cur.P) { cur.P = {}; cur.params.forEach(p => cur.P[p.key] = p.value); }
  if (!cur.ready) { cur.init(true); cur.ready = true; }
  cv.style.cursor = drawing() ? "crosshair" : "pointer";
  $("status").textContent = drawing() ? "Drag to draw" : S.locked ? "Esc to release" : "Click the chart to lock the pointer";
  S.jx = S.jy = 0;
  $("p-title").textContent = cur.title; $("p-sub").textContent = cur.sub; $("p-task").innerHTML = cur.task;
  $("p-how").textContent = cur.how; $("p-cite").textContent = cur.cite;
  [...tabs.children].forEach((t, k) => t.setAttribute("aria-current", k === idx));
  $("count").textContent = `Prototype ${idx + 1} of ${PROTOS.length}`;
  $("prev").disabled = idx === 0; $("next").disabled = idx === PROTOS.length - 1;
  try { history.replaceState(null, "", "#" + cur.id); } catch (e) {}
  renderParams();
  render();
}
$("prev").onclick = () => show(idx - 1); $("next").onclick = () => show(idx + 1);
document.addEventListener("keydown", e => {
  if (S.locked || e.target.closest("input")) return;
  if (e.key === "ArrowRight") show(idx + 1);
  if (e.key === "ArrowLeft") show(idx - 1);
});
const start = PROTOS.findIndex(p => p.id === location.hash.slice(1));
show(start >= 0 ? start : 0);
window.addEventListener("hashchange", () => { const j = PROTOS.findIndex(p => p.id === location.hash.slice(1)); if (j >= 0 && j !== idx) show(j); });
document.fonts && document.fonts.ready.then(render);
})();
</script>
</body>
</html>
